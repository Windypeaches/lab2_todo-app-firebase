<!DOCTYPE html>
<html>
<head>
    <title>Firebase Login Test</title>
</head>
<body>

    <h2>Login</h2>

    <input id="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <button onclick="login()">Login</button>

    <h3>Add Task</h3>
    <input id="task" placeholder="Task title" />
    <button onclick="addTask()">Add</button>

<pre id="output"></pre>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
        apiKey: "AIzaSyBC3QAqcTNcpjOUnVzJYLy8L82X3Ng8jas",
        authDomain: "todo-app-lab2.firebaseapp.com",
        projectId: "todo-app-lab2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let token = "";

        window.login = async function() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        token = await userCredential.user.getIdToken();

        document.getElementById("output").innerText = "Login success\nToken:\n" + token;
        }

        window.addTask = async function() {
        const title = document.getElementById("task").value;

        const res = await fetch("http://127.0.0.1:8001/tasks", {
        method: "POST",
        headers: {
        "Authorization": "Bearer " + token,
        "Content-Type": "application/json"
        },
        body: JSON.stringify({ title })
        });

        const data = await res.json();
        document.getElementById("output").innerText = JSON.stringify(data, null, 2);
        }
    </script>

</body>
</html>
